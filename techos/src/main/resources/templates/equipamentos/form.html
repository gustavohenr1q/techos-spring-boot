
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Equipamento · TechOS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/techos.css}">
</head>

<body>

<!-- MENU ORIGINAL -->
<nav class="navbar navbar-expand-lg navbar-techos sticky-top"
     data-bs-theme="dark">
    <div class="container-xl">

        <a class="navbar-brand" th:href="@{/}">
            <span class="brand-mark">T</span>TechOS
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal"
                aria-expanded="false"
                aria-label="Abrir menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-lg-3">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">Painel</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/clientes}">Clientes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active"
                       aria-current="page"
                       th:href="@{/equipamentos}">Equipamentos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/ordens-servico}">Ordens de serviço</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- AVISOS -->
<div class="container-xl pt-3">

    <div class="alert alert-success mb-0"
         th:if="${mensagem != null}"
         th:text="${mensagem}">
        Salvo com sucesso.
    </div>

    <div class="alert alert-danger mb-0"
         th:if="${erro != null}"
         th:text="${erro}">
        Algo deu errado.
    </div>

</div>

<!-- CONTEÚDO -->
<main class="container-xl py-4">

    <div class="page-head">
        <h1 class="h3"
            th:text="${equipamento.id == null} ? 'Novo equipamento' : 'Editar equipamento'">
            Novo equipamento
        </h1>
    </div>

    <div class="panel" style="max-width:640px">

        <form class="panel-body"
              method="post"
              th:action="@{/equipamentos/salvar}"
              th:object="${equipamento}">

            <!-- ID DO EQUIPAMENTO -->
            <input type="hidden" th:field="*{id}">

            <!-- CLIENTE -->
            <div class="mb-3">

                <label class="form-label" for="cliente">
                    Cliente
                </label>

                <select id="cliente"
                        name="clienteId"
                        class="form-select"
                        th:classappend="${#fields.hasErrors('cliente')} ? 'is-invalid' : ''"
                        required>

                    <option value="">Escolha o cliente</option>

                    <option th:each="c : ${clientes}"
                            th:value="${c.id}"
                            th:text="${c.nome}"
                            th:selected="${clienteIdSelecionado != null ? clienteIdSelecionado == c.id : (equipamento.cliente != null and equipamento.cliente.id == c.id)}">
                        Maria Souza
                    </option>

                </select>

                <div class="invalid-feedback"
                     th:if="${#fields.hasErrors('cliente')}"
                     th:errors="*{cliente}">
                    Selecione um cliente válido.
                </div>

            </div>

            <!-- TIPO E MARCA -->
            <div class="row g-3 mb-3">

                <!-- TIPO -->
                <div class="col-12 col-sm-5">

                    <label class="form-label" for="tipo">
                        Tipo
                    </label>

                    <select id="tipo"
                            class="form-select"
                            th:field="*{tipo}"
                            th:errorclass="is-invalid"
                            required>

                        <option value="">Selecione o tipo</option>

                        <option th:each="t : ${tipos}"
                                th:value="${t}"
                                th:text="${t}">
                            NOTEBOOK
                        </option>

                    </select>

                    <div class="invalid-feedback"
                         th:errors="*{tipo}">
                        Selecione o tipo do equipamento.
                    </div>

                </div>

                <!-- MARCA -->
                <div class="col-12 col-sm-7">

                    <label class="form-label" for="marca">
                        Marca
                    </label>

                    <input type="text"
                           id="marca"
                           class="form-control"
                           th:field="*{marca}"
                           th:errorclass="is-invalid"
                           maxlength="255"
                           required>

                    <div class="invalid-feedback"
                         th:errors="*{marca}">
                        Informe a marca.
                    </div>

                </div>

            </div>

            <!-- MODELO E NÚMERO DE SÉRIE -->
            <div class="row g-3 mb-4">

                <!-- MODELO -->
                <div class="col-12 col-sm-6">

                    <label class="form-label" for="modelo">
                        Modelo
                    </label>

                    <input type="text"
                           id="modelo"
                           class="form-control"
                           th:field="*{modelo}"
                           th:errorclass="is-invalid"
                           maxlength="255"
                           required>

                    <div class="invalid-feedback"
                         th:errors="*{modelo}">
                        Informe o modelo.
                    </div>

                </div>

                <!-- NÚMERO DE SÉRIE -->
                <div class="col-12 col-sm-6">

                    <label class="form-label" for="numeroSerie">
                        Número de série
                    </label>

                    <input type="text"
                           id="numeroSerie"
                           class="form-control"
                           th:field="*{numeroSerie}"
                           th:errorclass="is-invalid"
                           maxlength="255"
                           required>

                    <div class="invalid-feedback"
                         th:errors="*{numeroSerie}">
                        Informe um número de série válido.
                    </div>

                </div>

            </div>

            <!-- BOTÕES -->
            <div class="d-flex flex-wrap gap-2">

                <button class="btn btn-primary"
                        type="submit"
                        th:text="${equipamento.id == null} ? 'Cadastrar equipamento' : 'Salvar alterações'">
                    Salvar equipamento
                </button>

                <a class="btn btn-outline-secondary"
                   th:href="@{/equipamentos}">
                    Cancelar
                </a>

                <!-- FOTOS DE ENTRADA E SAÍDA -->
                <a class="btn btn-outline-secondary"
                   th:if="${equipamento.id != null}"
                   th:href="@{/equipamentos/{id}/fotos(id=${equipamento.id})}">
                    Fotos de entrada e saída
                </a>

            </div>

        </form>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
