
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cliente · TechOS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/techos.css}">
</head>

<body>

    <!-- MENU -->
    <nav class="navbar navbar-expand-lg navbar-techos sticky-top" data-bs-theme="dark">
        <div class="container-xl">
            <a class="navbar-brand" th:href="@{/}">
                <span class="brand-mark">T</span>TechOS
            </a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-lg-3">
                    <li class="nav-item"><a class="nav-link" th:href="@{/}">Painel</a></li>
                    <li class="nav-item"><a class="nav-link active" th:href="@{/clientes}">Clientes</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/equipamentos}">Equipamentos</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/os}">Ordens de serviço</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- AVISOS -->
    <div class="container-xl pt-3">
        <div class="alert alert-success mb-0"
             th:if="${mensagem != null}" th:text="${mensagem}"></div>

        <div class="alert alert-danger mb-0"
             th:if="${erro != null}" th:text="${erro}"></div>
    </div>

    <!-- CONTEÚDO -->
    <main class="container-xl py-4">

        <div class="page-head">
            <div>
                <h1 class="h3"
                    th:text="${cliente.id == null} ? 'Novo cliente' : 'Editar cliente'">
                    Novo cliente
                </h1>
                <p class="text-secondary mb-0">
                    Cadastre as informações do cliente.
                </p>
            </div>
        </div>

        <div class="panel" style="max-width: 760px">

            <form class="panel-body" method="post"
                  th:action="${cliente.id == null}
                  ? @{/clientes/salvar}
                  : @{/clientes/atualizar}"
                  th:object="${cliente}" novalidate>

                <input type="hidden" th:field="*{id}">

                <!-- DADOS PESSOAIS -->
                <h2 class="h5 mb-3">Dados pessoais</h2>

                <div class="mb-3">
                    <label class="form-label" for="nome">Nome completo *</label>
                    <input type="text" id="nome" class="form-control"
                           th:field="*{nome}" th:errorclass="is-invalid"
                           placeholder="Nome completo do cliente"
                           maxlength="100" required autofocus>
                    <div class="invalid-feedback" th:errors="*{nome}"></div>
                </div>

                <div class="row g-3 mb-3">

                    <div class="col-12 col-md-6">
                        <label class="form-label" for="cpf">CPF</label>
                        <input type="text" id="cpf" class="form-control"
                               th:field="*{cpf}"
                               placeholder="000.000.000-00"
                               maxlength="14">
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label" for="telefone">Telefone / WhatsApp *</label>
                        <input type="tel" id="telefone" class="form-control"
                               th:field="*{telefone}" th:errorclass="is-invalid"
                               placeholder="(11) 99999-0000" required>
                        <div class="invalid-feedback" th:errors="*{telefone}"></div>
                    </div>

                    <div class="col-12">
                        <label class="form-label" for="email">E-mail</label>
                        <input type="email" id="email" class="form-control"
                               th:field="*{email}" th:errorclass="is-invalid"
                               placeholder="cliente@email.com">
                        <div class="invalid-feedback" th:errors="*{email}"></div>
                    </div>

                </div>

                <hr class="my-4">

                <!-- ENDEREÇO -->
                <h2 class="h5 mb-1">Endereço</h2>
                <p class="text-secondary small mb-3">
                    Informe o CEP para preencher o endereço automaticamente.
                </p>

                <div class="row g-3 mb-3">

                    <div class="col-12 col-md-5">
                        <label class="form-label" for="cep">CEP</label>
                        <input type="text" id="cep" class="form-control"
                               th:field="*{cep}"
                               placeholder="00000-000"
                               maxlength="9"
                               autocomplete="postal-code">
                        <div class="form-text" id="cepMensagem">
                            Digite o CEP para buscar o endereço.
                        </div>
                    </div>

                    <div class="col-12 col-md-7">
                        <label class="form-label" for="logradouro">Rua / Logradouro</label>
                        <input type="text" id="logradouro" class="form-control"
                               th:field="*{logradouro}"
                               autocomplete="address-line1">
                    </div>

                    <div class="col-12 col-md-4">
                        <label class="form-label" for="numero">Número</label>
                        <input type="text" id="numero" class="form-control"
                               th:field="*{numero}">
                    </div>

                    <div class="col-12 col-md-8">
                        <label class="form-label" for="complemento">Complemento</label>
                        <input type="text" id="complemento" class="form-control"
                               th:field="*{complemento}"
                               placeholder="Apartamento, bloco, sala...">
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label" for="bairro">Bairro</label>
                        <input type="text" id="bairro" class="form-control"
                               th:field="*{bairro}">
                    </div>

                    <div class="col-12 col-md-4">
                        <label class="form-label" for="cidade">Cidade</label>
                        <input type="text" id="cidade" class="form-control"
                               th:field="*{cidade}">
                    </div>

                    <div class="col-12 col-md-2">
                        <label class="form-label" for="estado">UF</label>
                        <input type="text" id="estado" class="form-control"
                               th:field="*{estado}" maxlength="2">
                    </div>

                </div>

                <hr class="my-4">

                <!-- DATA DE CADASTRO -->
                <div th:if="${cliente.dataCadastro != null}" class="mb-4">
                    <label class="form-label">Data de cadastro</label>
                    <input type="text" class="form-control"
                           th:value="${#temporals.format(cliente.dataCadastro, 'dd/MM/yyyy HH:mm')}"
                           readonly>
                </div>

                <div class="d-flex flex-wrap gap-2">
                    <button class="btn btn-primary" type="submit">
                        Salvar cliente
                    </button>

                    <a class="btn btn-outline-secondary" th:href="@{/clientes}">
                        Cancelar
                    </a>
                </div>

            </form>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- CONSULTA DE CEP -->
    <script>
        const campoCep = document.getElementById("cep");
        const mensagemCep = document.getElementById("cepMensagem");

        campoCep.addEventListener("blur", buscarCep);

        async function buscarCep() {
            const cep = campoCep.value.replace(/\D/g, "");

            if (cep.length === 0) {
                mensagemCep.textContent = "Digite o CEP para buscar o endereço.";
                return;
            }

            if (cep.length !== 8) {
                mensagemCep.textContent = "Informe um CEP com 8 números.";
                mensagemCep.className = "form-text text-danger";
                return;
            }

            mensagemCep.textContent = "Buscando endereço...";
            mensagemCep.className = "form-text text-secondary";

            try {
                const resposta = await fetch(`https://viacep.com.br/ws/${cep}/json/`);

                if (!resposta.ok) {
                    throw new Error("Falha na consulta");
                }

                const dados = await resposta.json();

                if (dados.erro) {
                    mensagemCep.textContent = "CEP não encontrado.";
                    mensagemCep.className = "form-text text-danger";
                    return;
                }

                document.getElementById("logradouro").value = dados.logradouro || "";
                document.getElementById("bairro").value = dados.bairro || "";
                document.getElementById("cidade").value = dados.localidade || "";
                document.getElementById("estado").value = dados.uf || "";

                mensagemCep.textContent = "Endereço preenchido com sucesso!";
                mensagemCep.className = "form-text text-success";

                document.getElementById("numero").focus();

            } catch (erro) {
                mensagemCep.textContent = "Não foi possível consultar o CEP. Tente novamente.";
                mensagemCep.className = "form-text text-danger";
            }
        }
    </script>

</body>
</html>
