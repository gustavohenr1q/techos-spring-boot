
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clientes · TechOS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/techos.css}">
</head>

<body>

<!-- MENU ORIGINAL -->
<nav class="navbar navbar-expand-lg navbar-techos sticky-top"
     data-bs-theme="dark">
    <div class="container-xl">

        <a class="navbar-brand" th:href="@{/}">
            <span class="brand-mark">T</span>TechOS
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal"
                aria-expanded="false"
                aria-label="Abrir menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-lg-3">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">Painel</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page"
                       th:href="@{/clientes}">Clientes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/equipamentos}">Equipamentos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/ordens-servico}">Ordens de serviço</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- AVISOS -->
<div class="container-xl pt-3">

    <div class="alert alert-success mb-0"
         role="status"
         th:if="${mensagem != null}"
         th:text="${mensagem}">
    </div>

    <div class="alert alert-danger mb-0"
         role="alert"
         th:if="${erro != null}"
         th:text="${erro}">
    </div>

</div>

<!-- CONTEÚDO -->
<main class="container-xl py-4">

    <div class="page-head">

        <h1 class="h3">Clientes</h1>

        <a class="btn btn-primary"
           th:href="@{/clientes/novo}">
            Novo cliente
        </a>

    </div>

    <!-- PESQUISA -->
    <form class="row g-2 mb-3"
          method="get"
          th:action="@{/clientes}"
          role="search">

        <div class="col-12 col-sm-8 col-md-5">

            <label class="visually-hidden" for="busca">
                Buscar cliente por nome
            </label>

            <input type="search"
                   id="busca"
                   name="busca"
                   class="form-control"
                   placeholder="Buscar por nome"
                   th:value="${busca}"
                   maxlength="100">
        </div>

        <div class="col-auto">
            <button class="btn btn-outline-secondary"
                    type="submit">
                Buscar
            </button>
        </div>

        <div class="col-auto"
             th:if="${!#strings.isEmpty(busca)}">

            <a class="btn btn-outline-secondary"
               th:href="@{/clientes}">
                Limpar
            </a>
        </div>
    </form>

    <!-- CONTADOR DE RESULTADOS -->
    <p class="text-secondary small mb-3"
       th:unless="${#lists.isEmpty(clientes)}">

        <span th:text="${#lists.size(clientes)}">0</span>

        <span th:text="${#lists.size(clientes) == 1} ? 'cliente encontrado' : 'clientes encontrados'">
            clientes encontrados
        </span>
    </p>

    <!-- ESTADO VAZIO -->
    <div class="panel"
         th:if="${#lists.isEmpty(clientes)}">

        <div class="empty">

            <p class="fw-semibold mb-1"
               th:text="${#strings.isEmpty(busca)} ? 'Nenhum cliente por aqui' : 'Nenhum cliente encontrado'">
                Nenhum cliente por aqui
            </p>

            <p class="text-secondary"
               th:text="${#strings.isEmpty(busca)} ? 'Cadastre o primeiro cliente para começar a receber equipamentos.' : 'Nenhum cliente corresponde à pesquisa realizada.'">
                Cadastre o primeiro cliente.
            </p>

            <a class="btn btn-primary"
               th:if="${#strings.isEmpty(busca)}"
               th:href="@{/clientes/novo}">
                Cadastrar cliente
            </a>

            <a class="btn btn-outline-secondary"
               th:unless="${#strings.isEmpty(busca)}"
               th:href="@{/clientes}">
                Ver todos os clientes
            </a>

        </div>
    </div>

    <!-- TABELA DE CLIENTES -->
    <div class="panel"
         th:unless="${#lists.isEmpty(clientes)}">

        <div class="table-responsive">

            <table class="table table-hover align-middle">

                <thead>
                    <tr>
                        <th scope="col">Nome</th>
                        <th scope="col">Telefone</th>

                        <th scope="col"
                            class="d-none d-md-table-cell">
                            E-mail
                        </th>

                        <th scope="col" class="text-end">
                            Ações
                        </th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="c : ${clientes}">

                        <th scope="row"
                            class="fw-semibold"
                            th:text="${c.nome}">
                            Maria Souza
                        </th>

                        <td th:text="${c.telefone}">
                            (11) 99999-0000
                        </td>

                        <td class="d-none d-md-table-cell"
                            th:text="${#strings.isEmpty(c.email) ? 'Não informado' : c.email}">
                            maria@email.com
                        </td>

                        <td class="text-end text-nowrap">

                            <a class="btn btn-sm btn-outline-secondary"
                               th:href="@{/clientes/{id}/editar(id=${c.id})}"
                               th:aria-label="|Editar cliente ${c.nome}|">
                                Editar
                            </a>

                            <form class="d-inline"
                                  method="post"
                                  th:action="@{/clientes/{id}/excluir(id=${c.id})}"
                                  onsubmit="return confirm('Deseja realmente excluir este cliente? Esta ação não poderá ser desfeita.');">

                                <button class="btn btn-sm btn-outline-danger"
                                        type="submit"
                                        th:aria-label="|Excluir cliente ${c.nome}|">
                                    Excluir
                                </button>

                            </form>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
