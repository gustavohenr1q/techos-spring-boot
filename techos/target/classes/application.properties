# Endereço do banco de dados
spring.datasource.url=jdbc:mysql://localhost:3306/techos

# Usuário do banco de dados
spring.datasource.username=root
# Senha do banco de dados
spring.datasource.password=

# Update: o Spring JPA irá atualizar o banco de dados automaticamente com base nas entidades definidas
spring.jpa.hibernate.ddl-auto=update

# Mostra o terminal SQL gerado pelo Hibernate
spring.jpa.show-sql=true

# Limites dos uploads fotográficos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=26MB

# Fotos fora da pasta pública do sistema
techos.fotos.diretorio=${user.home}/techos-fotos
